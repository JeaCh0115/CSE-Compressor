name: CI

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: 语法编译
        run: python -m compileall -q csengine cscli csgui tests tools run.py

      - name: 单元测试
        run: python -m unittest discover -s tests -v

      - name: CLI 冒烟（压缩 → 校验 → 列出 → 解压）
        run: |
          mkdir smoke
          echo "CSE Compressor CI smoke test" > smoke/hello.txt
          python run.py c smoke -o smoke/demo.zip -f zip
          python run.py t smoke/demo.zip
          python run.py l smoke/demo.zip
          python run.py x smoke/demo.zip -o smoke/out

      - name: 覆盖率体检（引擎 / CLI 只依赖标准库）
        run: python -c "import csengine, cscli.main; print('engine ok', csengine.__name__)"
